<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Categories | ShopWithCarlos</title>
  <meta name="description" content="Browse all categories of stores and promo codes on ShopWithCarlos." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://shopwithcarlos.xyz/categories/" />
  <link rel="stylesheet" href="/styles.css" />
  <!-- If you temporarily need to load from GitHub RAW, swap the line above for:
  <link rel="stylesheet" href="https://raw.githubusercontent.com/carlitosdrl/promo-codes/main/styles.css" />
  -->
</head>
<body>
  <header>
    <nav>
      <a href="/" aria-label="Back to home">ShopWithCarlos</a>
    </nav>
  </header>

  <main>
    <h1>All Categories</h1>
    <p>Explore every category available on ShopWithCarlos.</p>

    <!-- Breadcrumbs (optional, matches simple static layout) -->
    <p><a href="/">Home</a> &raquo; <span>Categories</span></p>

    <!-- Category list -->
    <section aria-labelledby="categories-heading">
      <h2 id="categories-heading" class="sr-only">Category list</h2>
      <ul id="category-list"></ul>
    </section>

    <noscript>
      <p>Please enable JavaScript to load the category list.</p>
    </noscript>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> ShopWithCarlos</p>
  </footer>

  <!-- Structured data for better SERP presentation -->
  <script type="application/ld+json" id="itemlist-json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "ShopWithCarlos Categories",
    "itemListElement": []
  }
  </script>

  <script>
    // --- Config ---
    const GH_API = "https://api.github.com/repos/carlitosdrl/promo-codes/contents/categories";
    const DEST_URL = (slug) => `/categories/${slug}/`; // adjust if your category pages live elsewhere

    // --- Helpers ---
    const stripExt = (name) => name.replace(/\.[^.]+$/, "");
    const slugify = (name) => stripExt(name).toLowerCase();
    const prettify = (name) =>
      slugify(name)
        .split(/[-_]/g)
        .map(s => s.charAt(0).toUpperCase() + s.slice(1))
        .join(" ");

    function addItemToDOM(name, idx) {
      const list = document.getElementById("category-list");
      const li = document.createElement("li");
      const a = document.createElement("a");
      const slug = slugify(name);

      a.href = DEST_URL(slug);
      a.textContent = prettify(name);
      a.setAttribute("aria-label", `Open ${a.textContent} category`);
      li.appendChild(a);
      list.appendChild(li);

      // Update ItemList JSON-LD
      const script = document.getElementById("itemlist-json");
      const data = JSON.parse(script.textContent);
      data.itemListElement.push({
        "@type": "ListItem",
        "position": idx + 1,
        "name": a.textContent,
        "url": a.href
      });
      script.textContent = JSON.stringify(data);
    }

    async function loadCategories() {
      try {
        const res = await fetch(GH_API, { headers: { "Accept": "application/vnd.github+json" }});
        if (!res.ok) throw new Error("Could not read /categories directory from GitHub.");
        const data = await res.json();

        // Choose what represents a "category" in your repo:
        // OPTION A) Directories are categories (default):
        let items = data.filter(x => x.type === "dir");

        // OPTION B) Files are categories (e.g., .json/.md). Uncomment and customize:
        // let items = data.filter(x => x.type === "file" && /\.json$/i.test(x.name));

        if (!items.length) {
          document.getElementById("category-list").innerHTML = "<li>No categories found.</li>";
          return;
        }

        items
          .sort((a, b) => prettify(a.name).localeCompare(prettify(b.name)))
          .forEach((item, i) => addItemToDOM(item.name, i));
      } catch (err) {
        console.error(err);
        document.getElementById("category-list").innerHTML =
          "<li>There was a problem loading categories. Please try again later.</li>";
      }
    }

    // Simple UX touches
    document.getElementById("year").textContent = new Date().getFullYear();
    loadCategories();
  </script>

  <!-- Minimal utility class in case your stylesheet doesn't define it -->
  <style>
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</body>
</html>
