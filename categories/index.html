<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Categories | ShopWithCarlos</title>
  <meta name="description" content="Browse all categories of stores and promo codes on ShopWithCarlos." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="canonical" href="https://shopwithcarlos.xyz/categories/" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <nav>
      <a href="/" aria-label="Back to home">
        <img src="/images/swc-logo.svg?v=3" alt="ShopWithCarlos" class="logo" width="300" height="120" decoding="async" fetchpriority="high">
      </a>
    </nav>
  </header>

  <main>
    <h1>All Categories</h1>
    <p>Explore every category available on ShopWithCarlos.</p>

    <p><a href="/">Home</a> &raquo; <span>Categories</span></p>

    <!-- Lista de categorías con mismo estilo que el home -->
    <ul id="category-list" class="stores"> </ul>

    <noscript>
      <p>Please enable JavaScript to load the category list.</p>
    </noscript>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> ShopWithCarlos</p>
  </footer>

  <!-- JSON-LD -->
  <script type="application/ld+json" id="itemlist-json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "ShopWithCarlos Categories",
    "itemListElement": []
  }
  </script>

  <script>
    const GH_API = "https://api.github.com/repos/carlitosdrl/promo-codes/contents/categories";
    const DEST_URL = (slug) => `/categories/${slug}/`;

    const stripExt = (n) => n.replace(/\.[^.]+$/, "");
    const slugify  = (n) => stripExt(n).toLowerCase();
    const prettify = (n) => slugify(n).split(/[-_]/g).map(s => s.charAt(0).toUpperCase()+s.slice(1)).join(" ");

    function pushJSONLD(name, url, pos){
      const el = document.getElementById("itemlist-json");
      const data = JSON.parse(el.textContent);
      data.itemListElement.push({"@type":"ListItem","position":pos,"name":name,"url":url});
      el.textContent = JSON.stringify(data);
    }

    function addCategory(name, idx){
      const list = document.getElementById("category-list");
      const li = document.createElement("li");
      li.className = "store";

      const a = document.createElement("a");
      const title = prettify(name);
      const slug  = slugify(name);
      a.href = DEST_URL(slug);

      const span = document.createElement("span");
      span.className = "store-name";
      span.textContent = title;

      a.appendChild(span);
      li.appendChild(a);
      list.appendChild(li);

      pushJSONLD(title, a.href, idx+1);
    }

    async function loadCategories(){
      try{
        const res = await fetch(GH_API, { headers:{ "Accept":"application/vnd.github+json" }});
        if(!res.ok) throw new Error("Could not read /categories directory from GitHub.");
        const data = await res.json();

        // Carpeta = categoría
        let items = data.filter(x => x.type === "dir");

        if(!items.length){
          document.getElementById("category-list").innerHTML = "<li>No categories found.</li>";
          return;
        }

        items
          .sort((a,b) => prettify(a.name).localeCompare(prettify(b.name)))
          .forEach((it,i) => addCategory(it.name, i));
      }catch(e){
        console.error(e);
        document.getElementById("category-list").innerHTML = "<li>There was a problem loading categories. Please try again later.</li>";
      }
    }

    document.getElementById("year").textContent = new Date().getFullYear();
    loadCategories();
  </script>

  <style>
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</body>
</html>
