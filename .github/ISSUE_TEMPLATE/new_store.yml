name: "New Store"
description: "Create a new store page and home card from this form."
title: "New store: <store name>"
labels: ["new-store"]
body:
  - type: textarea
    id: yaml
    attributes:
      label: Store data (YAML)
      description: Paste/edit this YAML block. The workflow will generate the page and update the home grid.
      value: |
        ```yaml
        store_name: "Brand Name"
        store_domain: "brand.com"          # used for /stores/<store_domain>/
        offer: "X% Off ..."
        code: "CODE123"
        affiliate_url: "https://brand.com/discount/CODE123?..."  # full URL
        category: "outdoors & energy"
        og_image: "brand.png"              # file in /images/
        seo_title: "Brand Promo Code — Save X%"
        seo_description: "Verified coupon for Brand. How to apply + FAQs."
        h1: "Brand Coupon & Promo Code — Save X% at brand.com"
        lead: "Use code CODE123 at checkout to save X% on ..."
        site_domain: "tu-dominio.com"      # tu dominio real o el de GitHub Pages
        site_name: "Shop With Carlos"
        ga_id: "G-HS58KQFT2B"
        year: 2025
        ```
    validations:
      required: true
