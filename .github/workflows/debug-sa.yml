name: Debug Google SA JSON

on:
  workflow_dispatch:

jobs:
  test-sa-json:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Crear sa.json desde secret base64
      run: |
        echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > sa.json

    - name: Mostrar contenido parcial de sa.json
      run: |
        echo "Mostrando las primeras 10 líneas del archivo:"
        head -n 10 sa.json || echo "Archivo vacío o ilegible"

    - name: Validar JSON
      run: |
        python -c "import json; json.load(open('sa.json'))" && echo "✅ JSON válido"
