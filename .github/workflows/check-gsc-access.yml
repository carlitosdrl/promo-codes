name: Verificar acceso a Search Console

on:
  workflow_dispatch:

jobs:
  check-access:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: 🔐 Decodificar archivo de credenciales desde base64
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > sa.json

      - name: 📝 Crear script de verificación
        run: |
          cat <<EOF > check_gsc_access.py
from google.oauth2 import service_account
from googleapiclient.discovery import build

SCOPES = ["https://www.googleapis.com/auth/webmasters"]
SERVICE_ACCOUNT_FILE = "sa.json"

print("📂 Cargando credenciales...")
try:
    credentials = service_account.Credentials.from_service_account_file(
        SERVICE_ACCOUNT_FILE, scopes=SCOPES
    )
    service = build("webmasters", "v3", credentials=credentials)
    print("🔍 Consultando propiedades de Search Console...")
    site_list = service.sites().list().execute()
    print("\\n📋 Propiedades visibles por esta cuenta de servicio:\\n")
    for site in site_list.get("siteEntry", []):
        print(f"- {site['siteUrl']} (Permiso: {site['permissionLevel']})")
except Exception as e:
    print("❌ Error:", e)
    exit(1)
EOF

      - name: 🚀 Ejecutar verificación
        run: python check_gsc_access.py
