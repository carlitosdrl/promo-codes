name: Add store from Issue
on:
  issues:
    types: [opened, edited, labeled, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  add:
    if: >
      (github.event_name == 'issues' &&
       (contains(join(fromJson(toJson(github.event.issue.labels)).*.name, ','), 'new-store')
        || startsWith(github.event.issue.title, 'New store')))
      || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract YAML block from issue
        id: extract
        run: |
          # Guardamos el cuerpo del issue en un archivo para evitar problemas de comillas
          printf "%s" "${{ github.event.issue.body }}" > ISSUE_BODY.txt

          # Ejecutamos Python con heredoc (¡ojo: sin espacio entre << y 'PY'!)
          python3 - <<'PY'
import re, sys, pathlib
body = pathlib.Path('ISSUE_BODY.txt').read_text(encoding='utf-8', errors='ignore')
m = re.search(r"```(?:yaml|yml)?\s*\n(.*?)\n```", body, re.S|re.I)
if not m:
    print("No YAML code block found in issue body.", file=sys.stderr)
    raise SystemExit(1)
pathlib.Path('data.yml').write_text(m.group(1).strip(), encoding='utf-8')
PY

          # Exponemos el YAML extraído como output (útil para debug)
          echo "yaml<<EOF" >> "$GITHUB_OUTPUT"
          cat data.yml >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"


      - name: Debug extracted YAML
        run: |
          echo "----- data.yml -----"
          sed -n '1,200p' data.yml || true
          echo "--------------------"

      - name: Install yq and jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq -o=json data.yml > data.json

      - name: Validate inputs
        id: meta
        run: |
          set -euo pipefail
          REQUIRED=(store_name store_domain offer affiliate_url og_image seo_title seo_description h1 lead site_domain site_name ga_id year)
          for k in "${REQUIRED[@]}"; do
            v=$(yq -r ".${k} // \"\"" data.yml)
            if [ -z "$v" ]; then
              echo "Missing required field: $k"; exit 1;
            fi
          done
          DOMAIN=$(yq -r '.store_domain // ""' data.yml | tr '[:upper:]' '[:lower:]')
          if [[ -z "$DOMAIN" || ! "$DOMAIN" =~ ^[a-z0-9.-]+$ ]]; then
            echo "store_domain invalid"; exit 1
          fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Render store page (inject your footer)
        run: |
          python3 - << 'PY'
import re, json, datetime
from pathlib import Path
root = Path('.')
data = json.loads(Path('data.json').read_text())

site_domain = data['site_domain'].rstrip('/')
store_domain = data['store_domain']
brand = data['store_name']
store_url = data.get('store_url') or f"https://{store_domain}"
code = (data.get('code') or '').strip()
has_code = bool(code)

today = datetime.date.today()
verified_iso = (data.get('verified_date') or today.isoformat())
try:
    d = datetime.date.fromisoformat(verified_iso[:10])
    verified_human = d.strftime("%A, %B %d, %Y")
except Exception:
    verified_human = verified_iso
published_iso = data.get('published_iso', verified_iso)
modified_iso = data.get('modified_iso', today.isoformat())

# Secciones condicionales sin multilínea
if has_code:
    display_code = code
    howto = (
        f"<section>\n"
        f"  <h2>How do I apply the promo code at {store_domain}?</h2>\n"
        f"  <ol>\n"
        f"    <li><a href=\"{data['affiliate_url']}\" rel=\"sponsored nofollow noopener noreferrer\" target=\"_blank\">Visit {brand}</a></li>\n"
        f"    <li>Add items to the cart</li>\n"
        f"    <li>At checkout, enter the code <strong>{code}</strong></li>\n"
        f"    <li>Enjoy your discount</li>\n"
        f"  </ol>\n"
        f"</section>"
    )
    offer_desc_jsonld = f"Use code {code} at checkout."
else:
    display_code = 'No code required'
    howto = (
        f"<section>\n"
        f"  <h2>How do I get the discount at {store_domain}?</h2>\n"
        f"  <ol>\n"
        f"    <li><a href=\"{data['affiliate_url']}\" rel=\"sponsored nofollow noopener noreferrer\" target=\"_blank\">Visit {brand}</a></li>\n"
        f"    <li>The discount is applied automatically at checkout (no code).</li>\n"
        f"  </ol>\n"
        f"</section>"
    )
    offer_desc_jsonld = "Discount is applied automatically at checkout."

tpl = (root/'templates'/'store-template.html').read_text(encoding='utf-8')
idx = (root/'index.html').read_text(encoding='utf-8', errors='ignore')
m = re.search(r'<footer[\s\S]*?</footer>', idx, re.I)
footer_html = m.group(0) if m else f'<footer class="footer"><p>© {data["year"]} {data["site_name"]}</p></footer>'

about_raw = data.get('about_html','')

def esc(s: str) -> str:
    return s.replace('{','{{').replace('}','}}')

html_out = tpl.format(
  SEO_TITLE = data['seo_title'],
  SEO_DESCRIPTION = data['seo_description'],
  SITE_DOMAIN = site_domain,
  STORE_DOMAIN = store_domain,
  OG_TITLE = data['seo_title'],
  OG_DESCRIPTION = data['seo_description'],
  OG_IMAGE = data['og_image'],
  SITE_NAME = data['site_name'],
  GA_ID = data['ga_id'],
  BRAND_NAME = brand,
  STORE_URL = store_url,
  H1 = data['h1'],
  LEAD = data['lead'],
  OFFER = data['offer'],
  OFFER_DESC_JSONLD = esc(offer_desc_jsonld),
  AFFILIATE_URL = data['affiliate_url'],
  DISPLAY_CODE = display_code,
  HOWTO_SECTION = esc(howto),
  ABOUT_HTML = esc(about_raw),
  VERIFIED_ISO = verified_iso,
  VERIFIED_HUMAN = verified_human,
  PUBLISHED_ISO = published_iso,
  MODIFIED_ISO = modified_iso,
  FOOTER = esc(footer_html)
)

outdir = root/'stores'/store_domain
outdir.mkdir(parents=True, exist_ok=True)
(outdir/'index.html').write_text(html_out, encoding='utf-8')
PY

      - name: Insert card into home grid
        run: |
          python3 - << 'PY'
import json
from pathlib import Path
root = Path('.')
data = json.loads(Path('data.json').read_text())

code = (data.get('code') or '').strip()
display_code = code if code else 'No code required'

card_tpl = (root/'templates'/'card-template.html').read_text(encoding='utf-8')
card = card_tpl.format(
  DATA_NAME = data['store_name'].lower().strip().replace(' ', ''),
  CATEGORY = data.get('category','misc'),
  AFFILIATE_URL = data['affiliate_url'],
  STORE_NAME = data['store_name'],
  OG_IMAGE = data['og_image'],
  OFFER = data['offer'],
  CODE = display_code,
  STORE_DOMAIN = data['store_domain'],
)

idxp = root/'index.html'
idx = idxp.read_text(encoding='utf-8')
start_marker = '<!-- STORES:START -->'
end_marker = '<!-- STORES:END -->'
if start_marker in idx and end_marker in idx:
    idx = idx.replace(end_marker, card + '\n' + end_marker)
    idxp.write_text(idx, encoding='utf-8')
else:
    raise SystemExit('Markers not found in index.html (STORES:START/END)')
PY

      - name: Insert JSON-LD ListItem
        run: |
          python3 - << 'PY'
import re, json
from pathlib import Path
root = Path('.')
data = json.loads(Path('data.json').read_text())
idxp = root/'index.html'
idx = idxp.read_text(encoding='utf-8')
start_marker = '<!-- STORES_JSONLD:START -->'
end_marker = '<!-- STORES_JSONLD:END -->'
if start_marker in idx and end_marker in idx:
    start = idx.index(start_marker) + len(start_marker)
    end   = idx.index(end_marker)
    region = idx[start:end]
    count = len([m for m in re.finditer(r'"@type"\s*:\s*"ListItem"', region)])
    position = count + 1
    line = '{{"@type":"ListItem","position":{pos},"url":"https://{dom}/stores/{sd}/"}}\n'.format(
      pos=position, dom=data['site_domain'].rstrip('/'), sd=data['store_domain']
    )
    idx = idx.replace(end_marker, line + end_marker)
    idxp.write_text(idx, encoding='utf-8')
else:
    raise SystemExit('Markers not found in index.html (STORES_JSONLD:START/END)')
PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add store: ${{ steps.meta.outputs.domain }} (via Issue #${{ github.event.issue.number }})" || echo "No changes to commit"
          git push

      - name: Comment with published URL & close issue
        run: |
          python3 - << 'PY'
import json, pathlib
data = json.loads(pathlib.Path('data.json').read_text())
page_url = f"https://{data['site_domain'].rstrip('/')}/stores/{data['store_domain']}/"
pathlib.Path('comment.txt').write_text(page_url, encoding='utf-8')
PY

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const url = fs.readFileSync('comment.txt', 'utf8').trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Store created: ${url}`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
