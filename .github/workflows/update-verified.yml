name: Update verified date on store edits

on:
  push:
    branches: [ main, master ]
    paths:
      - 'stores/**/index.html'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Today (UTC)
        id: now
        run: echo "today=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Update dates in store pages
        shell: bash
        env:
          TODAY: ${{ steps.now.outputs.today }}
        run: |
          set -e
          files=$(git ls-files 'stores/**/index.html' || true)
          if [ -z "$files" ]; then
            echo "No store pages found"; exit 0
          fi

          for f in $files; do
            echo "Processing $f"

            # 1) JSON-LD: "dateModified":"YYYY-MM-DD" -> TODAY (si existe)
            perl -0777 -i -pe 's/(\"dateModified\"\s*:\s*\")\d{4}-\d{2}-\d{2}(\")/${1}$ENV{TODAY}$2/g' "$f"

            # 2) <time id="verified-date"> -> TODAY (si existe)
            perl -0777 -i -pe 's/(<time\s+id=\"verified-date\"[^>]*datetime=\")\d{4}-\d{2}-\d{2}(\"[^>]*>)(\d{4}-\d{2}-\d{2})(<\/time>)/${1}$ENV{TODAY}$2$ENV{TODAY}$4/g' "$f"
          done

      - name: Commit changes (if any)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update verified date to ${{ steps.now.outputs.today }}"
            git push
          else
            echo "Nothing to commit"
          fi
