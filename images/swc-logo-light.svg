<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title"
     viewBox="0 0 360 88">
  <title id="title">ShopWithCarlos</title>

  <defs>
    <!-- Gradiente un poco más luminoso para verse en oscuro -->
    <linearGradient id="brandLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Badge redondo -->
  <g transform="translate(12,12)" filter="url(#softShadow)">
    <circle cx="32" cy="32" r="32" fill="url(#brandLight)"/>
    <path d="M20 34 l8 8 l18 -20" fill="none" stroke="#fff" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark sin espacios en blanco -->
  <text x="96" y="54"
        font-size="30" font-weight="600" letter-spacing=".2"
        fill="#FFFFFF"
        text-rendering="geometricPrecision"
        font-family="Poppins, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    ShopWithCarlos
  </text>
</svg>
