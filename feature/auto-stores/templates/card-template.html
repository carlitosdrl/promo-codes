<article class="card store-card" data-name="{DATA_NAME}" data-category="{CATEGORY}">
  <a class="store-link" href="{AFFILIATE_URL}" rel="sponsored nofollow noreferrer" aria-label="{STORE_NAME} affiliate deal">
    <img src="/images/{OG_IMAGE}" alt="{STORE_NAME} logo" width="300" height="300" loading="lazy" class="store-logo"/>
    <div class="store-content">
      <h3 class="store-title">{STORE_NAME}</h3>
      <p class="store-offer">{OFFER}</p>
      <p class="store-code"><strong>Code:</strong> <code>{CODE}</code></p>
      <p class="store-cta">Go to deal ↗</p>
    </div>
  </a>
  <p class="store-details"><a href="/stores/{STORE_DOMAIN}/">Details &amp; how to apply</a></p>
</article>
